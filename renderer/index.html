<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:" />
    <title>Agent Kanban</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><span class="logo" data-icon="logo"></span><span class="brand-text"><span class="brand-name">Agent Kanban</span><span id="appVersion" class="brand-ver"></span></span></div>
      <button id="repoBtn" class="repo" title="リポジトリを選ぶ"></button>
      <div class="spacer"></div>
      <span id="remoteInfo" class="pill remote-pill hidden" title="遠隔操作の状態"></span>
      <span id="costInfo" class="pill cost hidden" title="Claude の週間上限のリセットに合わせた、今週このリポジトリのタスクで使った金額"></span>
      <span id="runInfo" class="pill"></span>
      <button id="rcBtn" class="btn ghost" title="遠隔操作（RC）: ホストの開始・別の PC への接続・SSH の鍵"><span data-icon="monitor"></span>RC設定</button>
      <button id="settingsBtn" class="btn ghost"><span data-icon="settings"></span>設定</button>
      <button id="chatBtn" class="btn chat-btn" title="タスクを作らずに、このリポジトリについてエージェントと話します"><span data-icon="chat"></span>会話<span id="chatCount" class="chat-count hidden"></span></button>
      <button id="newBtn" class="btn primary"><span data-icon="plus"></span>新しいタスク</button>
      <button id="issueBtn" class="btn"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" style="vertical-align:-2px"><path fill="currentColor" d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0Zm0 1.5a6.5 6.5 0 1 1 0 13 6.5 6.5 0 0 1 0-13ZM8 5a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/></svg> Issue から作成</button>
      <div class="notif-wrap">
        <button id="notifBtn" class="btn ghost notif-btn" title="通知"><span data-icon="bell"></span><span id="notifCount" class="notif-count hidden"></span></button>
        <div id="notifPanel" class="notif-panel hidden" role="dialog" aria-label="通知"></div>
      </div>
    </header>
    <div id="envBanner" class="env-banner hidden"></div>
    <div id="interruptBanner" class="int-banner hidden"></div>
    <div class="layout">
      <main id="board" class="board"></main>
      <div id="detailBackdrop" class="d-backdrop hidden"></div>
      <aside id="detail" class="detail hidden">
        <div id="detailResizer" class="d-resizer" title="ドラッグで幅を変えられます（ダブルクリックで元の幅に戻します）"></div>
        <div id="detailHead" class="d-head"></div>
        <div id="splitHead" class="d-vsplit" title="ドラッグで高さを変えられます（ダブルクリックで元の高さに戻します）"></div>
        <nav class="tabs" id="tabs">
          <button data-tab="log" class="tab active">ログ</button>
          <button data-tab="worktree" class="tab" title="worktree の作業状況（コミット・未コミットの変更・ベースとの関係）を見ます">worktree</button>
          <button data-tab="diff" class="tab">差分</button>
          <button data-tab="prompt" class="tab">指示</button>
          <button data-tab="btw" class="tab" id="btwTab" title="実行中のエージェントに、作業を止めずにメッセージを送ります">btw</button>
        </nav>
        <div id="detailBody" class="d-body"></div>
        <div id="splitFoot" class="d-vsplit" title="ドラッグで高さを変えられます（ダブルクリックで元の高さに戻します）"></div>
        <div id="detailFoot" class="d-foot">
          <div id="followSkill" class="skill-slot"></div>
          <div id="followAttach" class="attach-bar hidden"></div>
          <div class="d-foot-row">
            <textarea id="followInput" rows="2" placeholder="追加の指示を送る（Ctrl/⌘ + Enter で送信）"></textarea>
            <button id="followBtn" class="btn primary">送信</button>
          </div>
        </div>
      </aside>
    </div>
    <div id="modal" class="modal hidden"><div class="modal-box" id="modalBox"></div></div>
    <div id="skillPicker" class="modal picker hidden"><div class="modal-box wide" id="skillPickerBox"></div></div>
    <div id="busy" class="busy hidden" role="alert" aria-live="assertive" aria-busy="true"><div class="busy-box"><span class="spinner" aria-hidden="true"></span><span id="busyMsg">処理しています…</span></div></div>
    <div id="toast" class="toast hidden"></div>
    <script src="icons.js"></script>
    <script src="diff-parse.js"></script>
    <script src="markdown.js"></script>
    <script src="chat-log.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
