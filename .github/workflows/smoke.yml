# パッケージしたアプリを、実際の macOS / Windows で起動して画面が出るか確かめる
# 1. このコミットからビルドしたアプリ
# 2. Release の最新版をインストール用スクリプトで入れたアプリ（ユーザーと同じ手順）
name: Smoke test packaged app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright-core@1.48.2

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --dir --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --dir --x64 --publish never

      - name: Launch the app built from this commit (macOS)
        timeout-minutes: 6
        if: runner.os == 'macOS'
        run: |
          ls dist
          codesign -dv --verbose=2 "dist/mac-arm64/Claude Agent Kanban.app" 2>&1 | head -20 || true
          node test/smoke-packaged.js "dist/mac-arm64/Claude Agent Kanban.app/Contents/MacOS/Claude Agent Kanban" smoke-built.png
      - name: Launch the app built from this commit (Windows)
        timeout-minutes: 6
        if: runner.os == 'Windows'
        run: node test/smoke-packaged.js "dist/win-unpacked/Claude Agent Kanban.exe" smoke-built.png

      - name: Install the latest release like a user and launch it (macOS)
        timeout-minutes: 6
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.sh" | /bin/bash
          APP="/Applications/Claude Agent Kanban.app"
          [ -d "$APP" ] || APP="$HOME/Applications/Claude Agent Kanban.app"
          ls -la "$APP/Contents/Resources" | head -20
          xattr -l "$APP" || true
          node test/smoke-packaged.js "$APP/Contents/MacOS/Claude Agent Kanban" smoke-installed.png
      - name: Install the latest release like a user and launch it (Windows)
        timeout-minutes: 6
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: powershell
        env:
          AGENT_KANBAN_NO_LAUNCH: '1'
        run: |
          irm "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.ps1" | iex
          node test/smoke-packaged.js "$env:LOCALAPPDATA\Programs\Claude Agent Kanban\Claude Agent Kanban.exe" smoke-installed.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ runner.os }}
          path: smoke-*.png
          if-no-files-found: ignore
