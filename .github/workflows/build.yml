# Windows（exe）・macOS（dmg）・Linux（AppImage）のアプリをビルドする
# - push / プルリクエスト: テストだけ（Mac の実行環境を無駄に使わないため）
# - main への push で、package.json の version（例: 0.1.0）のリリースがまだなければ、
#   3つの OS でビルドし、タグ v0.1.0 と GitHub Release を作ってファイルを添付し、インストールを確かめる
#   → 新しいバージョンを出すときは package.json の version を上げて main に push するだけ
# - 手動実行（Actions の「Run workflow」）: 3つの OS でビルドして「Artifacts」に置く（リリースはしない）
# - 同じブランチに新しい push が来たら、古い実行は取り消す（最新の push だけ動かす）
name: Build desktop apps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      release: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: リリースするか判断
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ] \
             && ! gh release view "v$version" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "v$version をリリースします"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: test
    # ビルドは、リリースするときと手動実行のときだけ
    if: needs.test.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # 証明書なしでビルドする（macOS はアドホック署名）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # ビルドしたアプリを実際に起動して、画面が出るか確かめる（Mac / Windows）
      - name: Launch the built app and check the window
        if: runner.os != 'Linux'
        timeout-minutes: 6
        shell: bash
        run: |
          npm install --no-save playwright-core@1.48.2
          if [ "$RUNNER_OS" = "macOS" ]; then
            ls dist
            APP=$(ls -d dist/mac*/"Claude Agent Kanban.app" | head -n1)
            codesign -dv --verbose=2 "$APP" 2>&1 | head -12 || true
            node test/smoke-packaged.js "$APP/Contents/MacOS/Claude Agent Kanban" smoke-built.png
          else
            node test/smoke-packaged.js "dist/win-unpacked/Claude Agent Kanban.exe" smoke-built.png
          fi
      - uses: actions/upload-artifact@v7
        if: always() && runner.os != 'Linux'
        with:
          name: smoke-built-${{ runner.os }}
          path: smoke-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: claude-agent-kanban-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error

  release:
    needs: [test, build]
    if: needs.test.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.test.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Claude Agent Kanban v${{ needs.test.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage

  # インストール用スクリプトを、実際の OS で最新の Release に対して試す
  # （macOS は標準の /bin/bash 3.2、Windows は標準の Windows PowerShell 5.1 で実行する）
  install-script:
    # リリースしたあと、その版をインストール用スクリプトで入れて確かめる
    needs: [test, build, release]
    if: needs.release.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: install.sh（macOS / Linux）
        if: runner.os != 'Windows'
        run: |
          /bin/bash --version | head -n1
          # Same as a user would run: curl ... | bash  (pinned to this commit)
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.sh" | /bin/bash
          if [ "$RUNNER_OS" = "macOS" ]; then
            APP="/Applications/Claude Agent Kanban.app"
            [ -d "$APP" ] || APP="$HOME/Applications/Claude Agent Kanban.app"
            test -d "$APP"
            # ユーザーと同じく、インストールしたアプリを起動して画面を確かめる
            npm install --prefix /tmp/pw --no-save --no-package-lock playwright-core@1.48.2 >/dev/null
            ls -la "$APP/Contents/Resources" | head
            NODE_PATH=/tmp/pw/node_modules node test/smoke-packaged.js "$APP/Contents/MacOS/Claude Agent Kanban" smoke-installed.png
          else
            test -x "$HOME/.local/bin/claude-agent-kanban"
          fi
          /bin/bash ./install.sh --uninstall
      - name: install.ps1（Windows）
        if: runner.os == 'Windows'
        shell: powershell
        env:
          AGENT_KANBAN_NO_LAUNCH: '1'
        run: |
          $PSVersionTable.PSVersion
          # Same as a user would run: irm <raw url> | iex  (pinned to this commit)
          irm "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.ps1" | iex
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Claude Agent Kanban.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'installed exe not found' }
          Write-Host "OK: $($exe.FullName)"
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'Claude Agent Kanban.lnk'))) { throw 'start menu shortcut not found' }
          $env:AGENT_KANBAN_UNINSTALL = '1'
          irm "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.ps1" | iex
          if (Test-Path "$env:LOCALAPPDATA\Programs\Claude Agent Kanban") { throw 'uninstall failed' }
          Write-Host 'uninstall OK'
