# Windows（exe）・macOS（dmg）・Linux（AppImage）のアプリをビルドして、自動でリリースする
# - push / プルリクエスト: まずテスト
# - main への push: 最新のリリースからアプリの中身が変わっていれば、テストのあとすぐに
#   バージョンを自動で上げて（0.1.8 → 0.1.9）3つの OS でビルドし、GitHub Release を作り、インストールを確かめる
#   - 公開は Mac を待たない: Windows と Linux ができたら公開し、Mac の dmg は、できしだい同じ版に追加する
#     （Mac の実行環境は空き待ちが長いことがあるため。Mac のインストールは手元の Mac で確かめる）
#   - Mac が 10 分（変数 MACOS_QUEUE_MINUTES）たっても始まらなければ、Mac はスキップする（mac-timeout）
#   - 途中で次の push が来たら、前の実行は取り消す（続けてマージしても、リリースまで進むのは最後の1回）
#   - 0.2.0 のように大きく上げたいときは、package.json の version をその番号にして push する
#   - バージョンの決め方は scripts/next-version.js
# - 手動実行（Actions の「Run workflow」）: すぐに 3つの OS でビルドして「Artifacts」に置く（リリースはしない）
#   - アプリの中身が最新のリリースと同じなら、Mac の dmg をその版の番号で作り、その版に追加する（Mac を後から付けたいとき）
name: Build desktop apps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      release: ${{ steps.ver.outputs.release }}
      # 手動実行で、アプリの中身が最新のリリースと同じとき: Mac をその版の番号でビルドして、その版に追加する
      add_mac: ${{ steps.ver.outputs.add_mac }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # タグ（これまでのリリース）と、そこからの変更を見るため
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: 次のバージョンと、リリースするかを決める
        id: ver
        run: |
          r=$(node scripts/next-version.js)
          echo "$r"
          version=$(node -e "console.log(JSON.parse(process.argv[1]).version)" "$r")
          release=$(node -e "console.log(JSON.parse(process.argv[1]).release)" "$r")
          latest=$(node -e "console.log(JSON.parse(process.argv[1]).latest || '')" "$r")
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$release" = "false" ] && [ -n "$latest" ]; then
            # 最新のリリースからアプリの中身が変わっていない → その版の Mac の dmg を作って追加する
            version="$latest"
            echo "add_mac=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version に Mac の dmg を追加します（アプリの中身が v$version と同じため）"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ] && [ "$release" = "true" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version を自動でリリースします"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: test
    # ビルドは、リリースするときと手動実行のときだけ
    if: needs.test.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
          # Mac は下の build-mac（公開を待たせないよう、別のジョブにしている）
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: バージョンを入れる（v${{ needs.test.outputs.version }}）
        shell: bash
        run: npm version "${{ needs.test.outputs.version }}" --no-git-tag-version --allow-same-version
      - name: Build
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # 証明書なしでビルドする（macOS はアドホック署名）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # ビルドしたアプリを実際に起動して、画面が出るか確かめる（Mac / Windows）
      - name: Launch the built app and check the window
        if: runner.os != 'Linux'
        timeout-minutes: 6
        shell: bash
        run: |
          npm install --no-save playwright-core@1.48.2
          if [ "$RUNNER_OS" = "macOS" ]; then
            ls dist
            APP=$(ls -d dist/mac*/"Agent Kanban.app" | head -n1)
            codesign -dv --verbose=2 "$APP" 2>&1 | head -12 || true
            node test/smoke-packaged.js "$APP/Contents/MacOS/Agent Kanban" smoke-built.png
          else
            node test/smoke-packaged.js "dist/win-unpacked/Agent Kanban.exe" smoke-built.png
          fi
      - uses: actions/upload-artifact@v7
        if: always() && runner.os != 'Linux'
        with:
          name: smoke-built-${{ runner.os }}
          path: smoke-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: agent-kanban-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error

  # Mac のビルド。公開（release）はこれを待たない。できたら release-mac で同じ版に追加する
  build-mac:
    needs: test
    if: needs.test.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    # Mac の実行環境は、リポジトリの変数 MACOS_RUNNER で変えられる（空なら macos-14）
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-14' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: バージョンを入れる（v${{ needs.test.outputs.version }}）
        shell: bash
        run: npm version "${{ needs.test.outputs.version }}" --no-git-tag-version --allow-same-version
      - name: Build
        run: npx electron-builder --mac --publish never
        env:
          # 証明書なしでビルドする（macOS はアドホック署名）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # ビルドしたアプリを実際に起動して、画面が出るか確かめる（Mac / Windows）
      - name: Launch the built app and check the window
        if: runner.os != 'Linux'
        timeout-minutes: 6
        shell: bash
        run: |
          npm install --no-save playwright-core@1.48.2
          if [ "$RUNNER_OS" = "macOS" ]; then
            ls dist
            APP=$(ls -d dist/mac*/"Agent Kanban.app" | head -n1)
            codesign -dv --verbose=2 "$APP" 2>&1 | head -12 || true
            node test/smoke-packaged.js "$APP/Contents/MacOS/Agent Kanban" smoke-built.png
          else
            node test/smoke-packaged.js "dist/win-unpacked/Agent Kanban.exe" smoke-built.png
          fi
      - uses: actions/upload-artifact@v7
        if: always() && runner.os != 'Linux'
        with:
          name: smoke-built-${{ runner.os }}
          path: smoke-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: agent-kanban-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error

  # Mac が決まった時間（既定は 10 分。リポジトリの変数 MACOS_QUEUE_MINUTES で変えられる）たっても
  # 始まらなければ、Mac をスキップする。
  # GitHub には 1 つのジョブだけを取り消す方法がないので、ほかのジョブ（公開・インストールの確認）が
  # 終わるのを待ってから、この実行を取り消す（実行の結果は「cancelled」になるが、公開は済んでいる）
  mac-timeout:
    needs: test
    if: needs.test.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      LIMIT_MIN: ${{ vars.MACOS_QUEUE_MINUTES || '10' }}
    steps:
      - name: Mac が始まるのを待ち、始まらなければスキップする
        run: |
          api="repos/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          jobs() { gh api "$api/attempts/${{ github.run_attempt }}/jobs?per_page=100" -q '.jobs[]|[.name,.status,.created_at]|@tsv'; }
          limit=$(( LIMIT_MIN * 60 ))
          while true; do
            mac=$(jobs | awk -F'\t' '$1=="build-mac"')
            st=$(printf '%s' "$mac" | cut -f2)
            if [ -n "$st" ] && [ "$st" != "queued" ] && [ "$st" != "waiting" ] && [ "$st" != "pending" ]; then
              echo "Mac のビルドが始まりました（$st）"; exit 0
            fi
            created=$(printf '%s' "$mac" | cut -f3)
            if [ -n "$created" ] && [ $(( $(date +%s) - $(date -d "$created" +%s) )) -ge "$limit" ]; then break; fi
            sleep 20
          done
          echo "::warning::Mac の実行環境が ${LIMIT_MIN} 分たっても割り当てられないので、Mac をスキップします（この版には Mac の dmg が付きません）"
          # Mac とこのジョブ以外（公開・インストールの確認）が終わるのを待つ
          # （後のジョブは前が終わってから一覧に出てくるので、公開が終わり、しばらく変わらないことを確かめる）
          calm=0
          while [ "$calm" -lt 3 ]; do
            j=$(jobs)
            if printf '%s\n' "$j" | awk -F'\t' '$1!="build-mac" && $1!="mac-timeout" && $1!="release-mac" && $2!="completed"' | grep -q . \
              || ! printf '%s\n' "$j" | awk -F'\t' '$1=="release" && $2=="completed"' | grep -q .; then
              calm=0
            else
              calm=$(( calm + 1 ))
            fi
            sleep 20
          done
          # 待っているあいだに Mac が始まっていたら、取り消さない
          st=$(jobs | awk -F'\t' '$1=="build-mac"{print $2}')
          if [ "$st" != "queued" ] && [ "$st" != "waiting" ] && [ "$st" != "pending" ]; then
            echo "Mac のビルドが始まったので、スキップしません（$st）"; exit 0
          fi
          gh api -X POST "$api/cancel"

  release:
    # Mac（build-mac）は待たない
    needs: [test, build]
    if: needs.test.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.test.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Agent Kanban v${{ needs.test.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage

  # Mac の dmg を、公開済みの同じ版に追加する
  release-mac:
    needs: [test, release, build-mac]
    # 自動リリースのあと、または手動実行で最新の版に Mac を追加するとき（そのときは release がスキップされるので !cancelled() にする）
    if: >-
      !cancelled() && needs.build-mac.result == 'success' &&
      ((needs.test.outputs.release == 'true' && needs.release.result == 'success') || needs.test.outputs.add_mac == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: agent-kanban-macOS
          path: dist
      - run: ls -la dist
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.test.outputs.version }}
          name: Agent Kanban v${{ needs.test.outputs.version }}
          files: |
            dist/*.dmg
            dist/*.zip

  # インストール用スクリプトを、実際の OS で最新の Release に対して試す
  # （Windows は標準の Windows PowerShell 5.1 で実行する。Mac は手元の Mac で確かめるので、ここでは試さない）
  install-script:
    # リリースしたあと、その版をインストール用スクリプトで入れて確かめる
    needs: [test, build, release]
    if: needs.release.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: install.sh（macOS / Linux）
        if: runner.os != 'Windows'
        run: |
          /bin/bash --version | head -n1
          # Same as a user would run: curl ... | bash  (pinned to this commit)
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.sh" | /bin/bash
          if [ "$RUNNER_OS" = "macOS" ]; then
            APP="/Applications/Agent Kanban.app"
            [ -d "$APP" ] || APP="$HOME/Applications/Agent Kanban.app"
            test -d "$APP"
            # ユーザーと同じく、インストールしたアプリを起動して画面を確かめる
            npm install --prefix /tmp/pw --no-save --no-package-lock playwright-core@1.48.2 >/dev/null
            ls -la "$APP/Contents/Resources" | head
            NODE_PATH=/tmp/pw/node_modules node test/smoke-packaged.js "$APP/Contents/MacOS/Agent Kanban" smoke-installed.png
            # 起動したまま更新しても、アプリを終了してから入れ替え、起動し直すこと（入れ替えると古いプロセスの画面が壊れるため）
            open -a "$APP"
            for _ in $(seq 1 20); do pgrep -x "Agent Kanban" >/dev/null && break; sleep 1; done
            before=$(pgrep -x "Agent Kanban" | head -n1)
            echo "running before update: pid $before"
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.sh" | /bin/bash
            sleep 8
            after=$(pgrep -x "Agent Kanban" | head -n1 || true)
            echo "running after update: pid $after"
            test -n "$before" && test -n "$after" && test "$before" != "$after"
            osascript -e 'tell application "Agent Kanban" to quit' || true
            sleep 3
          else
            test -x "$HOME/.local/bin/agent-kanban"
          fi
          /bin/bash ./install.sh --uninstall
      - name: install.ps1（Windows）
        if: runner.os == 'Windows'
        shell: powershell
        env:
          AGENT_KANBAN_NO_LAUNCH: '1'
        run: |
          $PSVersionTable.PSVersion
          # Same as a user would run: irm <raw url> | iex  (pinned to this commit)
          irm "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.ps1" | iex
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Agent Kanban.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'installed exe not found' }
          Write-Host "OK: $($exe.FullName)"
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'Agent Kanban.lnk'))) { throw 'start menu shortcut not found' }
          $env:AGENT_KANBAN_UNINSTALL = '1'
          irm "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.ps1" | iex
          if (Test-Path "$env:LOCALAPPDATA\Programs\Agent Kanban") { throw 'uninstall failed' }
          Write-Host 'uninstall OK'
