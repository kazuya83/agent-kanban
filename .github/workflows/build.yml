# テストだけを動かす（push / プルリクエスト）
# アプリのビルドとリリースは、手元の Mac で行う（scripts/build-all.sh・scripts/release-local.sh、スキル /build-apps）
name: Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: bash -n install.sh
