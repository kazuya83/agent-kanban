# Windows（exe）・macOS（dmg）・Linux（AppImage）のアプリをビルドして、自動でリリースする
# - push / プルリクエスト: まずテスト
# - main への push: 最新のリリースからアプリの中身が変わっていれば、テストのあとすぐに
#   バージョンを自動で上げて（0.1.8 → 0.1.9）3つの OS でビルドし、GitHub Release を作り、インストールを確かめる
#   - 途中で次の push が来たら、前の実行は取り消す（続けてマージしても、リリースまで進むのは最後の1回）
#   - 0.2.0 のように大きく上げたいときは、package.json の version をその番号にして push する
#   - バージョンの決め方は scripts/next-version.js
# - 手動実行（Actions の「Run workflow」）: すぐに 3つの OS でビルドして「Artifacts」に置く（リリースはしない）
name: Build desktop apps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      release: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # タグ（これまでのリリース）と、そこからの変更を見るため
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: 次のバージョンと、リリースするかを決める
        id: ver
        run: |
          r=$(node scripts/next-version.js)
          echo "$r"
          version=$(node -e "console.log(JSON.parse(process.argv[1]).version)" "$r")
          release=$(node -e "console.log(JSON.parse(process.argv[1]).release)" "$r")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ] && [ "$release" = "true" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version を自動でリリースします"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: test
    # ビルドは、リリースするときと手動実行のときだけ
    if: needs.test.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: バージョンを入れる（v${{ needs.test.outputs.version }}）
        shell: bash
        run: npm version "${{ needs.test.outputs.version }}" --no-git-tag-version --allow-same-version
      - name: Build
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # 証明書なしでビルドする（macOS はアドホック署名）
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # ビルドしたアプリを実際に起動して、画面が出るか確かめる（Mac / Windows）
      - name: Launch the built app and check the window
        if: runner.os != 'Linux'
        timeout-minutes: 6
        shell: bash
        run: |
          npm install --no-save playwright-core@1.48.2
          if [ "$RUNNER_OS" = "macOS" ]; then
            ls dist
            APP=$(ls -d dist/mac*/"Agent Kanban.app" | head -n1)
            codesign -dv --verbose=2 "$APP" 2>&1 | head -12 || true
            node test/smoke-packaged.js "$APP/Contents/MacOS/Agent Kanban" smoke-built.png
          else
            node test/smoke-packaged.js "dist/win-unpacked/Agent Kanban.exe" smoke-built.png
          fi
      - uses: actions/upload-artifact@v7
        if: always() && runner.os != 'Linux'
        with:
          name: smoke-built-${{ runner.os }}
          path: smoke-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: agent-kanban-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error

  release:
    needs: [test, build]
    if: needs.test.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.test.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Agent Kanban v${{ needs.test.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage

  # インストール用スクリプトを、実際の OS で最新の Release に対して試す
  # （macOS は標準の /bin/bash 3.2、Windows は標準の Windows PowerShell 5.1 で実行する）
  install-script:
    # リリースしたあと、その版をインストール用スクリプトで入れて確かめる
    needs: [test, build, release]
    if: needs.release.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: install.sh（macOS / Linux）
        if: runner.os != 'Windows'
        run: |
          /bin/bash --version | head -n1
          # Same as a user would run: curl ... | bash  (pinned to this commit)
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.sh" | /bin/bash
          if [ "$RUNNER_OS" = "macOS" ]; then
            APP="/Applications/Agent Kanban.app"
            [ -d "$APP" ] || APP="$HOME/Applications/Agent Kanban.app"
            test -d "$APP"
            # ユーザーと同じく、インストールしたアプリを起動して画面を確かめる
            npm install --prefix /tmp/pw --no-save --no-package-lock playwright-core@1.48.2 >/dev/null
            ls -la "$APP/Contents/Resources" | head
            NODE_PATH=/tmp/pw/node_modules node test/smoke-packaged.js "$APP/Contents/MacOS/Agent Kanban" smoke-installed.png
            # 起動したまま更新しても、アプリを終了してから入れ替え、起動し直すこと（入れ替えると古いプロセスの画面が壊れるため）
            open -a "$APP"
            for _ in $(seq 1 20); do pgrep -x "Agent Kanban" >/dev/null && break; sleep 1; done
            before=$(pgrep -x "Agent Kanban" | head -n1)
            echo "running before update: pid $before"
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.sh" | /bin/bash
            sleep 8
            after=$(pgrep -x "Agent Kanban" | head -n1 || true)
            echo "running after update: pid $after"
            test -n "$before" && test -n "$after" && test "$before" != "$after"
            osascript -e 'tell application "Agent Kanban" to quit' || true
            sleep 3
          else
            test -x "$HOME/.local/bin/agent-kanban"
          fi
          /bin/bash ./install.sh --uninstall
      - name: install.ps1（Windows）
        if: runner.os == 'Windows'
        shell: powershell
        env:
          AGENT_KANBAN_NO_LAUNCH: '1'
        run: |
          $PSVersionTable.PSVersion
          # Same as a user would run: irm <raw url> | iex  (pinned to this commit)
          irm "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.ps1" | iex
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter 'Agent Kanban.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'installed exe not found' }
          Write-Host "OK: $($exe.FullName)"
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'Agent Kanban.lnk'))) { throw 'start menu shortcut not found' }
          $env:AGENT_KANBAN_UNINSTALL = '1'
          irm "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.ps1" | iex
          if (Test-Path "$env:LOCALAPPDATA\Programs\Agent Kanban") { throw 'uninstall failed' }
          Write-Host 'uninstall OK'
